# Shopify app configuration for Storevine Bundles.
client_id = "d1c8b13293b07718447b5f039c8e455a"
name = "Storevine Bundles"
application_url = "https://bundles.storevine.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# write_discounts: the automatic bundle discount (storevine-bundle-discount Function).
scopes = "read_products,write_discounts,read_orders"

[auth]
redirect_urls = ["https://bundles.storevine.app/auth/callback"]

# Storefront API: https://{shop}/apps/storevine-bundles/* -> {application_url}/proxy/*
[app_proxy]
url = "/proxy"
subpath = "storevine-bundles"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Plan changes (upgrade, cancel, trial end): re-sync paid features immediately.
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Bundle sales report: orders with lines added from the bundle block. Needs protected customer data (Level 1).
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
