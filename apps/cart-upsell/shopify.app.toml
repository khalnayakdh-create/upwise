# Shopify app configuration for Upwise Cart Upsell.
# Release config changes with the "Shopify app config" GitHub Action (or `shopify app deploy`).

client_id = "3e6e2d418655b16b1d9132a533b68a00"
name = "Upwise Cart Upsell"
application_url = "https://upwise-cart-upsell.akjr004.workers.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[access_scopes]
# Minimum scopes. Add only when a feature needs them (blueprint §6.7).
scopes = "read_products"

[auth]
redirect_urls = [
  "https://upwise-cart-upsell.akjr004.workers.dev/auth/callback",
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory privacy webhooks (App Store requirement). One handler for all three.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
