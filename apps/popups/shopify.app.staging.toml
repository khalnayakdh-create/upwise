# STAGING copy of shopify.app.toml: deploy with `shopify app deploy --config staging`.
# Keep in sync with shopify.app.toml (scopes, webhooks, proxy); only client_id, name and URLs differ.
# Shopify app configuration for Storevine Pop-ups.
client_id = "237ad81936da19c78dc04f5e2765cc45"
name = "Storevine Pop-ups Staging"
application_url = "https://popups-staging.storevine.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# Customers: save pop-up sign-ups as Shopify customers with email marketing consent (protected customer data, Level 2: email).
scopes = "read_customers,write_customers,write_discounts"

[auth]
redirect_urls = ["https://popups-staging.storevine.app/auth/callback"]

# Storefront API: https://{shop}/apps/storevine-popups/* -> {application_url}/proxy/*
[app_proxy]
url = "/proxy"
subpath = "storevine-popups"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Plan changes (upgrade, cancel, trial end): re-sync paid features immediately.
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
