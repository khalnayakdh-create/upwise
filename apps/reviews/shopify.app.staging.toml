# STAGING copy of shopify.app.toml: deploy with `shopify app deploy --config staging`.
# Keep in sync with shopify.app.toml (scopes, webhooks, proxy); only client_id, name and URLs differ.
# Shopify app configuration for Storevine Reviews.
client_id = "57d1954ee3dc645b1a29797096a88a22"
name = "Storevine Reviews Staging"
application_url = "https://reviews-staging.storevine.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# write_products: write Shopify's standard reviews.rating / reviews.rating_count product metafields.
# read_orders: fulfilled orders trigger review-request emails (needs protected customer data: email).
scopes = "read_products,write_products,read_orders"

[auth]
redirect_urls = ["https://reviews-staging.storevine.app/auth/callback"]

# Storefront API: https://{shop}/apps/storevine-reviews/* -> {application_url}/proxy/*
[app_proxy]
url = "/proxy"
subpath = "storevine-reviews"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Plan changes (upgrade, cancel, trial end): re-sync paid features immediately.
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Review requests: schedule an email when an order is fulfilled.
  # Needs protected customer data (Level 1 + name + email) selected for this app.
  [[webhooks.subscriptions]]
  topics = ["orders/fulfilled"]
  uri = "/webhooks/orders/fulfilled"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
