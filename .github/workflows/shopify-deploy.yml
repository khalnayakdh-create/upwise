name: Shopify app config

# Releases each app's shopify.app.toml (URLs, scopes, webhooks incl. privacy
# topics, app proxy) and its extensions to Shopify. A job skips when its app
# didn't change, has no client_id yet, or its automation token secret is missing.
on:
  push:
    branches: [main]
    paths:
      - "apps/*/shopify.app.toml"
      - "apps/*/extensions/**"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy all configured apps even if unchanged"
        type: boolean
        default: true
      allow_deletes:
        description: "Let Shopify delete extensions that were removed or renamed"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cart-upsell
            secret: SHOPIFY_APP_AUTOMATION_TOKEN_CART_UPSELL
          - app: reviews
            secret: SHOPIFY_APP_AUTOMATION_TOKEN_REVIEWS
          - app: popups
            secret: SHOPIFY_APP_AUTOMATION_TOKEN_POPUPS
          - app: bundles
            secret: SHOPIFY_APP_AUTOMATION_TOKEN_BUNDLES
    env:
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets[matrix.secret] }}
      # Deleting an extension removes it from every store, so it is opt-in:
      # a manual run with allow_deletes, or "[allow-deletes]" in the commit message.
      ALLOW_DELETES: ${{ inputs.allow_deletes || contains(github.event.head_commit.message, '[allow-deletes]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to deploy
        id: gate
        run: |
          dir="apps/${{ matrix.app }}"
          # Compare the whole push, not just its last commit.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD^"; fi
          if ! grep -Eq '^client_id = "[0-9a-f]{32}"' "$dir/shopify.app.toml"; then
            echo "::notice::${{ matrix.app }}: no client_id yet, skipping"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "::warning::${{ matrix.app }}: add repo secret ${{ matrix.secret }} to enable deploys"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only "$BASE" HEAD | grep -Eq "^($dir/shopify.app.toml|$dir/extensions/|package-lock.json)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.app }}: unchanged, skipping"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Deploy app config and extensions
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          extra=""
          if [ "$ALLOW_DELETES" = "true" ]; then extra="--allow-deletes"; fi
          npx --yes @shopify/cli@latest app deploy --allow-updates $extra \
            --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
